<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Vyapar Sangam</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo-box">
            <img src="logoCreator_imagetologo (1).png" alt="Vyapar Sangam Logo">
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="listings.html">Listings</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>

        <div class="nav-buttons">
            <a href="login.html" class="login-link">Login</a>
            <a href="register.html" class="register-btn">Register</a>
        </div>

    </header>


    <!-- ================= REGISTER PAGE ================= -->

    <main class="register-page">

        <div class="register-card">

            <div class="register-heading">

                <h1>Create Your Account</h1>

                <p>
                    Join Vyapar Sangam and start your journey.
                </p>

            </div>


            <form action="#" method="POST" class="register-form">


                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="role">I Want To</label>

                    <select id="role" name="role" required>

                        <option value="">
                            Select your role
                        </option>

                        <option value="buyer">
                            Buy a Business
                        </option>

                        <option value="seller">
                            Sell a Business
                        </option>

                    </select>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- TERMS -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            name="terms"
                            required
                        >

                        <span>
                            I agree to the Terms & Conditions and Privacy Policy.
                        </span>

                    </label>

                </div>


                <!-- REGISTER BUTTON -->

                <button type="submit" class="register-submit">
                    Create Account
                </button>

            </form>


            <!-- LOGIN LINK -->

            <div class="login-text">

                <p>
                    Already have an account?
                    <a href="login.html">Login here</a>
                </p>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-left">

            <div class="logo-box">
                <img
                    src="logoCreator_imagetologo (1).png"
                    alt="Vyapar Sangam Logo"
                >
            </div>

            <p>
                Building a bridge between generations
                <br>
                for established businesses.
            </p>

        </div>


        <div class="footer-right">

            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
            <a href="#">Privacy Policy</a>

        </div>

    </footer>

</body>

</html>
