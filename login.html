<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Vyapar Sangam</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo-box">

            <img
                src="logoCreator_imagetologo (1).png"
                alt="Vyapar Sangam Logo"
            >

        </div>


        <nav>

            <a href="index.html">Home</a>

            <a href="listings.html">Listings</a>

            <a href="about.html">About Us</a>

            <a href="contact.html">Contact</a>

        </nav>


        <div class="nav-buttons">

            <a href="login.html" class="login-link">
                Login
            </a>

            <a href="register.html" class="register-btn">
                Register
            </a>

        </div>

    </header>



    <!-- ================= LOGIN SECTION ================= -->

    <main class="login-page">


        <div class="login-card">


            <div class="login-heading">

                <h1>Welcome Back</h1>

                <p>
                    Login to continue to Vyapar Sangam
                </p>

            </div>



            <!-- ================= LOGIN FORM ================= -->

            <form
                action="login.html"
                method="POST"
                class="login-form"
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>



                <!-- ROLE -->

                <div class="form-group">

                    <label for="role">
                        Login As
                    </label>

                    <select
                        id="role"
                        name="role"
                        required
                    >

                        <option value="">
                            Select your role
                        </option>

                        <option value="buyer">
                            Buyer
                        </option>

                        <option value="seller">
                            Seller
                        </option>

                    </select>

                </div>



                <!-- REMEMBER + FORGOT -->

                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            name="remember_me"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-submit"
                >
                    Login
                </button>


            </form>



            <!-- ================= REGISTER ================= -->

            <div class="register-text">

                <p>

                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>

                </p>

            </div>


        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-left">

            <div class="logo-box">

                <img
                    src="logoCreator_imagetologo (1).png"
                    alt="Vyapar Sangam Logo"
                >

            </div>


            <p>

                Building a bridge between generations
                <br>
                for established businesses.

            </p>

        </div>



        <div class="footer-right">

            <a href="about.html">
                About Us
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="#">
                Privacy Policy
            </a>

        </div>

    </footer>


</body>

</html>
